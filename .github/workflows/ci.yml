name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (core, server, web)
        run: npm test
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test with accessibility checks
        run: npm run e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t veritome:ci .
      - name: Start container read-only and check health
        run: |
          docker run -d --name vt -p 3000:3000 --read-only --tmpfs /tmp veritome:ci
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/status && exit 0; sleep 2; done
          docker logs vt
          exit 1
